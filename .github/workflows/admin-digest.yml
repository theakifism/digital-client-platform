# Every morning (about 8:30 AM India time) asks the website to check itself and e-mail the admin if something needs attention.
# On Mondays it always sends a short weekly summary. The e-mail contains numbers only.
# Needs two GitHub secrets: SITE_URL (for example https://cards.yourcompany.com, no slash at the end) and CRON_SECRET
# (the same value as CRON_SECRET on the host). A RED run means an e-mail was due but could not be sent, or the site could not be reached.
name: Admin e-mail check

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send the e-mail now, even on a quiet day'
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to check itself
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force }}
        run: |
          set -e
          if [ -z "$SITE_URL" ]; then echo "The SITE_URL secret is missing."; exit 1; fi
          if [ -z "$CRON_SECRET" ]; then echo "The CRON_SECRET secret is missing."; exit 1; fi
          url="$SITE_URL/api/cron/digest"
          if [ "$FORCE" = "true" ]; then url="$url?force=1"; fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 --retry-delay 15 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$url"
          echo
