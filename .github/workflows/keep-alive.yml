# Calls the website every 3 days so the free database never pauses from inactivity.
# Needs one GitHub secret: SITE_URL (for example https://cards.yourcompany.com, no slash at the end).
name: Keep alive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health address
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -e
          if [ -z "$SITE_URL" ]; then echo "The SITE_URL secret is missing."; exit 1; fi
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 "$SITE_URL/api/health"
          echo
